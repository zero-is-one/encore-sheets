name: encoresheets
description: An offline sheet music reader prototype.
publish_to: none
version: 0.8.2+12
environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"
dependencies:
  archive: ^4.7.1
  flutter:
    sdk: flutter
  file_selector: ^1.0.3
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  pdfrx: 3.1.0
  share_plus: ^13.3.1
  wakelock_plus: 1.8.0
  printing: ^5.15.1
  pdf: ^3.13.1
  crypto: ^3.0.8
  image: ^4.13.1
  image_picker: ^1.2.4
  just_audio: ^0.10.6
  record: ^7.2.0
  flutter_midi_command: ^1.4.0
  flutter_midi_command_ble: ^1.4.0
  pdf_document: ^16.2.0
  http: ^1.6.0
  universal_ble: ^2.3.0
  xml: ^7.1.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  cryptography: ^2.9.0
  qr: 3.0.3
  mobile_scanner: ^7.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/first_light.pdf
    - assets/NotoSans-Regular.ttf
    - assets/NotoSans-OFL.txt
    - assets/brand/app-icon-classic.png
    - assets/brand/app-icon-midnight.png
    - assets/brand/app-icon-paper.png
