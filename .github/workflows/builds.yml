name: Build test packages

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        type: choice
        default: android
        options:
          - android
          - ipad
          - macos
          - windows
          - all
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      distribution:
        type: boolean
        default: false
    secrets:
      ANDROID_RELEASE_KEYSTORE:
        required: false
      ANDROID_RELEASE_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'all' && '["android","ipad","macos","windows"]' || format('["{0}"]', inputs.target)) }}
    runs-on: ${{ matrix.target == 'android' && 'ubuntu-24.04' || matrix.target == 'windows' && 'windows-2025' || 'macos-26' }}
    name: Build ${{ matrix.target }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          cache: true
      - name: Set up Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Android APK
        if: matrix.target == 'android' && !inputs.distribution
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;28.2.13676358"
          flutter pub get --enforce-lockfile
          flutter build apk --debug --no-pub
          cp build/app/outputs/flutter-apk/app-debug.apk EncoreSheets-android.apk
      - name: Build and verify signed Android ARM64 APK
        if: matrix.target == 'android' && inputs.distribution
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ENCORESHEETS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Missing Android release keystore}"
          : "${ENCORESHEETS_KEYSTORE_PASSWORD:?Missing Android release password}"
          umask 077
          export ENCORESHEETS_RELEASE_KEYSTORE="$RUNNER_TEMP/encoresheets-release.p12"
          trap 'rm -f -- "$ENCORESHEETS_RELEASE_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ENCORESHEETS_RELEASE_KEYSTORE"
          unset KEYSTORE_BASE64
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "ndk;28.2.13676358" "build-tools;36.0.0"
          flutter pub get --enforce-lockfile
          flutter build apk --release --target-platform android-arm64 --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk EncoreSheets-android-arm64.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --print-certs EncoreSheets-android-arm64.apk |
            grep -Fx 'Signer #1 certificate SHA-256 digest: b8f88f88e9d532c05dba573a51caae6300bf72f2035c41b241aadf3a34115fde'
          badging=$("$tools/aapt" dump badging EncoreSheets-android-arm64.apk)
          grep "^package: name='com\.encoresheets\.app'" <<< "$badging"
          architectures=$(unzip -Z1 EncoreSheets-android-arm64.apk | awk -F/ '$1 == "lib" && $3 ~ /\.so$/ {print $2}' | sort -u)
          printf 'APK architectures: %s\n' "$architectures"
          test "$architectures" = arm64-v8a
      - name: Build unsigned iPad device IPA
        if: matrix.target == 'ipad'
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign --no-pub
          mkdir Payload
          ditto build/ios/iphoneos/Runner.app Payload/Runner.app
          ditto -c -k --keepParent Payload EncoreSheets-ipad-unsigned.ipa
      - name: Build macOS app
        if: matrix.target == 'macos'
        run: |
          if [ ! -d macos ]; then
            flutter create --no-pub --platforms=macos --org app.encoresheets "$RUNNER_TEMP/encoresheets"
            mv "$RUNNER_TEMP/encoresheets/macos" macos
          fi
          flutter pub get --enforce-lockfile
          flutter build macos --release --no-pub
          codesign --verify --deep --strict build/macos/Build/Products/Release/encoresheets.app
          ditto -c -k --keepParent build/macos/Build/Products/Release/encoresheets.app EncoreSheets-macos.zip
      - name: Build Windows app
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path windows)) {
            $templateProject = Join-Path $env:RUNNER_TEMP encoresheets
            flutter create --no-pub --platforms=windows --org app.encoresheets $templateProject
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Move-Item (Join-Path $templateProject windows) windows
          }
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter build windows --release --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build/windows/x64/runner/Release/encoresheets.exe)) {
            throw 'Missing EncoreSheets executable'
          }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath EncoreSheets-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EncoreSheets-${{ matrix.target }}
          path: EncoreSheets-*
          if-no-files-found: error
          retention-days: 14
